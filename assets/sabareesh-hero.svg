<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Sabareesh — Software Developer, Flutter, Full-Stack, AI</title>
  <desc id="hero-desc">Animated Cyber Blue banner with a perspective grid, a flowing circuit trace, orbital rings and the name Sabareesh with a glowing underline.</desc>

  <defs>
    <linearGradient id="hero-bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B14"/>
      <stop offset="0.55" stop-color="#081426"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>

    <radialGradient id="hero-glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#168BFF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#1261A0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1261A0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hero-glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#71C7FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#71C7FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hero-signal-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#1261A0"/>
      <stop offset="0.5" stop-color="#71C7FF"/>
      <stop offset="1" stop-color="#168BFF"/>
    </linearGradient>

    <linearGradient id="hero-underline-grad" gradientUnits="userSpaceOnUse" x1="92" y1="0" x2="612" y2="0">
      <stop offset="0" stop-color="#168BFF" stop-opacity="0.15"/>
      <stop offset="0.25" stop-color="#168BFF"/>
      <stop offset="0.6" stop-color="#71C7FF"/>
      <stop offset="1" stop-color="#B9E5FF" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="hero-sweep-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71C7FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#71C7FF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#71C7FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hero-floor-fade-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="hero-floor-mask" maskUnits="userSpaceOnUse" x="0" y="330" width="1200" height="190">
      <rect x="0" y="330" width="1200" height="190" fill="url(#hero-floor-fade-grad)"/>
    </mask>

    <radialGradient id="hero-vignette-grad" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#050B14" stop-opacity="0"/>
      <stop offset="1" stop-color="#050B14" stop-opacity="0.75"/>
    </radialGradient>

    <pattern id="hero-fine-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#71C7FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="hero-underline-blur" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="hero-frame-clip">
      <rect x="0" y="0" width="1200" height="520" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-frame-clip)">
    <!-- Base -->
    <rect width="1200" height="520" fill="url(#hero-bg-grad)"/>
    <rect width="1200" height="520" fill="url(#hero-fine-grid)"/>

    <!-- Ambient lighting -->
    <ellipse cx="930" cy="205" rx="330" ry="260" fill="url(#hero-glow-a)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="440" rx="300" ry="170" fill="url(#hero-glow-b)">
      <animate attributeName="cx" values="150;300;150" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Perspective floor grid -->
    <g mask="url(#hero-floor-mask)" stroke="#168BFF" stroke-opacity="0.38" stroke-width="1" fill="none">
      <path d="M0 346H1200M0 366H1200M0 392H1200M0 424H1200M0 462H1200M0 508H1200"/>
      <path d="M600 316L-500 520M600 316L-300 520M600 316L-100 520M600 316L100 520M600 316L300 520M600 316L500 520M600 316L600 520M600 316L700 520M600 316L900 520M600 316L1100 520M600 316L1300 520M600 316L1500 520M600 316L1700 520"/>
    </g>

    <!-- Light sweep -->
    <rect x="-400" y="0" width="400" height="520" fill="url(#hero-sweep-grad)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1700 0" dur="14s" repeatCount="indefinite"/>
    </rect>

    <!-- Secondary circuit traces (top) -->
    <g fill="none" stroke="#1261A0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M90 70H250L280 100H410"/>
      <path d="M1200 92H1070L1040 122H930"/>
    </g>
    <g fill="none" stroke="url(#hero-signal-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M90 70H250L280 100H410" pathLength="1000" stroke-dasharray="120 880" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="0;-1000" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M1200 92H1070L1040 122H930" pathLength="1000" stroke-dasharray="120 880" stroke-dashoffset="-300">
        <animate attributeName="stroke-dashoffset" values="-300;-1300" dur="7.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="410" cy="100" r="3.5" fill="#050B14" stroke="#71C7FF" stroke-width="1.5"/>
    <circle cx="930" cy="122" r="3.5" fill="#050B14" stroke="#71C7FF" stroke-width="1.5"/>

    <!-- Main circuit trace / data signal -->
    <path d="M-10 448H150L190 408H430L470 448H700L740 408H980L1020 448H1210"
          fill="none" stroke="#1261A0" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-10 448H150L190 408H430L470 448H700L740 408H980L1020 448H1210"
          pathLength="1000" fill="none" stroke="#168BFF" stroke-opacity="0.16" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="90 910" stroke-dashoffset="-80">
      <animate attributeName="stroke-dashoffset" values="-80;-1080" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M-10 448H150L190 408H430L470 448H700L740 408H980L1020 448H1210"
          pathLength="1000" fill="none" stroke="url(#hero-signal-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="90 910" stroke-dashoffset="-80">
      <animate attributeName="stroke-dashoffset" values="-80;-1080" dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- Trace nodes with soft pulses -->
    <g fill="#050B14" stroke="#71C7FF" stroke-width="1.5">
      <circle cx="190" cy="408" r="4"/>
      <circle cx="470" cy="448" r="4"/>
      <circle cx="740" cy="408" r="4"/>
      <circle cx="1020" cy="448" r="4"/>
    </g>
    <g fill="none" stroke="#71C7FF" stroke-width="1">
      <circle cx="190" cy="408" r="4" opacity="0.5">
        <animate attributeName="r" values="4;13" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="740" cy="408" r="4" opacity="0.5">
        <animate attributeName="r" values="4;13" dur="4s" begin="1.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="448" r="4" opacity="0.5">
        <animate attributeName="r" values="4;13" dur="4s" begin="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="4s" begin="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Orbital geometry -->
    <g transform="translate(930 205)">
      <g fill="none" stroke="#71C7FF">
        <circle r="150" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="2 10" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="120s" repeatCount="indefinite"/>
        </circle>
        <circle r="104" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="46 14 6 14">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="80s" repeatCount="indefinite"/>
        </circle>
        <circle r="58" stroke="#168BFF" stroke-opacity="0.55" stroke-width="1.5"/>
        <circle r="6" fill="#168BFF" fill-opacity="0.9" stroke="none">
          <animate attributeName="r" values="5;7;5" dur="5s" repeatCount="indefinite"/>
        </circle>
      </g>
      <g stroke="#71C7FF" stroke-opacity="0.22" stroke-width="1">
        <path d="M-170 0H-70M70 0H170M0 -170V-70M0 70V170"/>
      </g>
      <circle r="4" fill="#B9E5FF">
        <animateMotion dur="26s" repeatCount="indefinite" path="M150 0A150 150 0 1 1 -150 0A150 150 0 1 1 150 0Z"/>
      </circle>
      <circle r="3" fill="#71C7FF" fill-opacity="0.85">
        <animateMotion dur="18s" repeatCount="indefinite" path="M58 0A58 58 0 1 0 -58 0A58 58 0 1 0 58 0Z"/>
      </circle>
    </g>

    <!-- Identity -->
    <g>
      <path d="M92 150H116" stroke="#71C7FF" stroke-width="2" stroke-linecap="round"/>
      <text x="128" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" letter-spacing="2" fill="#71C7FF" fill-opacity="0.85">@dev-sabaree</text>

      <text x="88" y="265" font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif" font-size="116" font-weight="700" letter-spacing="-3" fill="#F2F7FF">Sabareesh</text>

      <!-- Glowing underline -->
      <rect x="92" y="286" width="520" height="5" rx="2.5" fill="url(#hero-underline-grad)" filter="url(#hero-underline-blur)" opacity="0.8">
        <animate attributeName="opacity" values="0.55;0.9;0.55" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="92" y="286" width="520" height="4" rx="2" fill="url(#hero-underline-grad)"/>

      <text x="92" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="30" letter-spacing="0.5" fill="#B9E5FF">Software Developer • Flutter • Full-Stack • AI</text>
    </g>

    <!-- Frame accents -->
    <g fill="none" stroke="#71C7FF" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round">
      <path d="M28 58V28H58"/>
      <path d="M1142 28H1172V58"/>
      <path d="M28 462V492H58"/>
      <path d="M1142 492H1172V462"/>
    </g>
    <g stroke="#71C7FF" stroke-opacity="0.35" stroke-width="1">
      <path d="M600 40v10M595 45h10"/>
      <path d="M1100 300v10M1095 305h10"/>
    </g>

    <rect width="1200" height="520" fill="url(#hero-vignette-grad)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="519" rx="17.5" fill="none" stroke="#1261A0" stroke-opacity="0.55"/>
</svg>
